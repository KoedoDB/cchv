# The host daemon's modules, compiled as a library so that fuzz targets can reach them (the daemon is a binary whose main.rs declares
# its modules). The same module tree from the same files; the fuzz entry points are in src/entry.rs. The production sources are
# used as they are, apart from a few functions made pub(crate) so that entry.rs can call them.
[package]
name = "fuzz-daemon"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
cloudhv-common = { path = "../../crates/common" }
cloudhv-proto = { path = "../../crates/proto" }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
ttrpc = { version = "0.10", features = ["async"] }
protobuf = "3"
chrono = "0.4"
libc = "0.2"
base64 = { version = "0.23", default-features = false, features = ["std"] }
sha2 = "0.11"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
http-body-util = "0.1"
tower = "0.5"
arbitrary = { version = "1", features = ["derive"] }
tempfile = "3"
