# containerd-shimkit, vendored and cut down: see KOEDODB.md. The dependency versions are those of the upstream workspace
# (containerd/runwasi, Cargo.toml at 5a8fc8e9), written out here because this crate is built inside another workspace.
[package]
name = "containerd-shimkit"
description = "A small library for building containerd shims whose containers run elsewhere"
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/containerd/runwasi"
repository = "https://github.com/containerd/runwasi"
publish = false

[lib]
doctest = false

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
containerd-shim = "0.11"
futures = { version = "0.3.32", default-features = false, features = ["std"] }
log = "0.4"
oci-spec = { version = "0.9.0", default-features = false, features = ["runtime"] }
protobuf = "3.7"
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.52.3", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time"] }
trait-variant = "0.1"

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1.52.3", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-async-drop = "0.1"
