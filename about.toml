# cargo-about: which licenses the Rust crates in a release may be under (they are compiled into the shipped binaries).
# The list is of licenses that allow redistribution of binaries with the notices that THIRD-PARTY-LICENSES.txt carries.
# A crate under any other license makes `cargo about generate` fail, so a new dependency with an unexpected license is noticed.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "0BSD",
    "BSL-1.0",
]
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]
# Crates that are only used to build (build scripts, proc macros) are in the list too: their code does not end up in the binary, but
# listing them is the safe side.
ignore-build-dependencies = false
ignore-dev-dependencies = true
workarounds = ["ring"]
