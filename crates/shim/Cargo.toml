[package]
name = "containerd-shim-cloudhv"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "containerd shim for Cloud Hypervisor microVMs"

[[bin]]
name = "containerd-shim-cloudhv-v1"
path = "src/main.rs"

[dependencies]
cloudhv-common = { workspace = true }

# containerd task service for a shim whose containers run in a VM: our cut-down shimkit (a start from containerd/runwasi), pinned by commit
containerd-shimkit = { git = "https://github.com/KoedoDB/containerd-shimkit.git", rev = "e8f7dadb94959bad77b1a6d4cc090ca042d85559" }

# containerd gRPC client (for image digest resolution)
containerd-client = "0.8.0"

# Async runtime
tokio = { workspace = true }


# Error handling
anyhow = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
log = { workspace = true }

# System
nix = { workspace = true }
libc = { workspace = true }

# Time
chrono = { workspace = true }

# Encoding
base64 = "0.22"

# Hashing (the names of volumes in the guest, the keys of the erofs cache)
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "vm_overhead"
harness = false
