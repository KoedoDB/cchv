[package]
name = "containerd-shim-cloudhv"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "containerd shim for Cloud Hypervisor microVMs"

[[bin]]
name = "containerd-shim-cloudhv-v1"
path = "src/main.rs"

[dependencies]
cloudhv-common = { workspace = true }

# containerd task service for a shim whose containers run in a VM: our cut-down shimkit (a start from containerd/runwasi), pinned by commit
containerd-shimkit = { git = "https://github.com/KoedoDB/containerd-shimkit.git", rev = "89325ea9397d51fcd77540154ff5caf030875830" } # the commit after v0.1.2-koedodb.2 that adds Task::pids (without it, containerd takes a running task for a leaked shim when k3s restarts)

# containerd gRPC client (for image digest resolution)
containerd-client = "0.9.0"

# Async runtime
tokio = { workspace = true }


# Error handling
anyhow = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
log = { workspace = true }

# System
nix = { workspace = true }
libc = { workspace = true }

# Time
chrono = { workspace = true }

# Encoding
base64 = { version = "0.23", default-features = false, features = ["std"] }

# Hashing (the names of volumes in the guest, the keys of the erofs cache)
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8", features = ["async_tokio"] }

[[bench]]
name = "vm_overhead"
harness = false
